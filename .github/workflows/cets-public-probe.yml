name: CETS public-chain probe

on:
  push:
    branches:
      - temp/cets-research-bridge
    paths:
      - scripts/cets-public-probe.mjs
      - scripts/cets-bnbscan-probe.mjs
      - scripts/cets-rpc-verify.mjs
      - .github/workflows/cets-public-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/cets-public-probe.mjs
      - scripts/cets-bnbscan-probe.mjs
      - scripts/cets-rpc-verify.mjs
      - .github/workflows/cets-public-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Query fixed public blockchain endpoints
        run: node scripts/cets-public-probe.mjs

      - name: Query fixed BNBScan transfer histories
        run: node scripts/cets-bnbscan-probe.mjs

      - name: Reconstruct candidate history from BNB Chain event logs
        run: node scripts/cets-rpc-verify.mjs

      - name: Upload probe responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cets-public-probe
          path: research-output/*.json
          if-no-files-found: warn
          retention-days: 7
