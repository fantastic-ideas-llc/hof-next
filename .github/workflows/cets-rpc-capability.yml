name: CETS RPC capability

on:
  push:
    branches:
      - temp/cets-research-bridge
    paths:
      - scripts/cets-rpc-capability.mjs
      - .github/workflows/cets-rpc-capability.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/cets-rpc-capability.mjs
      - .github/workflows/cets-rpc-capability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/cets-rpc-capability.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cets-rpc-capability
          path: research-output/cets-rpc-capability.json
          if-no-files-found: warn
          retention-days: 7
